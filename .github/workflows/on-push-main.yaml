name: on-push-main

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write
  id-token: write

env:
  PACKAGE_PLATFORMS: linux_amd64 linux_arm64

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      - run: go build -v ./...
      - run: go vet ./...
      - name: Run linters
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: latest
          args: --timeout 10m

  xpkg-build:
    name: Build multi-platform xpkg
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build linux xpkgs
        run: make build.all PLATFORMS="${PACKAGE_PLATFORMS}" VERSION=v0.0.0

      - name: Check package artifacts
        run: |
          set -euo pipefail
          for platform in ${PACKAGE_PLATFORMS}; do
            test -f "_output/xpkg/${platform}/provider-listmonk-v0.0.0.xpkg"
          done

  version-and-tag:
    name: Version and Tag
    needs:
      - build
      - xpkg-build
    uses: unbounded-tech/workflow-vnext-tag/.github/workflows/workflow.yaml@57940706ad2325bd4f1fe50bb91880b643e9afae # v1.21.3
    secrets:
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
    with:
      useDeployKey: true
